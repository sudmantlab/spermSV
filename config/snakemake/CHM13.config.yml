#############################
### Project configuration ###
#############################

# Indicate working directory and metadata (sample) table
# data is expected in the data/ folder relative to the working directory
# need to write an "expected inputs/structure" doc for data/

workdir: "/global/scratch/users/stacy-l/spermSV"
sample_table: "/global/scratch/users/stacy-l/spermSV/config/snakemake/samples.tsv"

##########################
### Path configuration ###
##########################

# Specify paths to scripts, packages, and other tools not managed by conda
# Working on helper functions for managing environmental $PATH as necessary.

paths:
  HiFiAdapterFilt: 
    repo: "/global/scratch/users/stacy-l/spermSV/code/HiFiAdapterFilt"
    db: "/global/scratch/users/stacy-l/spermSV/code/HiFiAdapterFilt/DB"
  # trgt:
  #   repo: "/global/scratch/users/stacy-l/spermSV/code/trgt"
