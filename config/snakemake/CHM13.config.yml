###############################
### Analysis config options ###
###############################

# Indicate reference genome + annotation files (.bed, .gff, etc)
# The alias will be used for organizing mapping outputs:
# for example, output/mapping/CHM13 or output/mapping/hg38_no_alts

reference:
  fasta: "/global/scratch/users/stacy-l/references/T2T_CHM13/hs1.fa"
  alias: "CHM13"
  annotations:
    repeats: "/global/scratch/users/stacy-l/references/T2T_CHM13/T2T_CHM13_simpleRepeat.bed"
    segdups: "/global/scratch/users/stacy-l/references/T2T_CHM13/T2T_CHM13_sedefSegDups.bed"
    censat: "/global/scratch/users/stacy-l/references/T2T_CHM13/T2T_CHM13_censat.bed"

minimap2:
  readgroup: "@RG\\tID:{lane}\\tSM:{specimen}\\tPU:{smrtcell}\\tPL:PACBIO"

winnowmap:
  readgroup: "'@RG\\tID:{lane}\\tSM:{specimen}\\tPU:{smrtcell}\\tPL:PACBIO'"

meryl:
  k: 15
  distinct: 0.9998

samtools:
  minQ: 10
  readgroup: "'@RG\\tID:{specimen}\\tSM:{specimen}\\tPL:PACBIO'"

sniffles:
  minsupport: 1
  mapq: 20
  mosaic-af-min: 0
  mosaic-qc-strand: False

repeatmasker:
  species: "human"
  engine: "rmblast"

pepper_etc:
  mapQ: 10

singularity:
  mount_dir: "/global/scratch/users/stacy-l"